# Pings Supabase every few days so the free-tier project doesn't auto-pause
# from inactivity (Supabase pauses after 7 days with no database activity).
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       — e.g. https://dnwozxhtbgbpkdvknajh.supabase.co
#   SUPABASE_ANON_KEY   — the anon/public key (safe to use here; never the service_role key)
name: Supabase Keepalive

on:
  schedule:
    # Every 3 days at 03:00 UTC — comfortably inside Supabase's 7-day pause window.
    - cron: '0 3 */3 * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register activity
        run: |
          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/topics?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response status: $http_status"
          cat /tmp/response.json

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Supabase keepalive ping failed with status $http_status"
            exit 1
          fi

          echo "Supabase keepalive ping succeeded."
